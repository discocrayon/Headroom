[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
# Every check --strict turns on, listed one by one so that a mypy release
# cannot change the gate without an edit here, except disallow_any_generics:
# BaseCheck[T] uses T in parameter and return position, so the registry's
# bare Type[BaseCheck] can be written neither as Type[BaseCheck[object]],
# which rejects every registered check, nor as Type[BaseCheck[Any]], which
# disallow_any_explicit forbids. spec/verification/strategy.md owns this.
disallow_any_explicit = True
disallow_subclassing_any = True
disallow_untyped_calls = True
no_implicit_reexport = True
extra_checks = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
